<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard | AURA</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hod_dashboard.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.35.0/dist/apexcharts.min.js"></script>
</head>
<body>

    <!-- DASHBOARD LAYOUT -->
    <div class="dashboard" role="main">
        
        <!-- ═══ HEADER ═══ -->
        <header class="dashboard-header" role="banner">
            <div class="header-content">
                <div class="system-identity">
                    <h1 class="system-name text-gradient-aurora">AURA Executive</h1>
                    <div class="system-context">
                        <span class="welcome-text">Department Analytics & Oversight</span>
                        <span class="date-text" id="currentDate"></span>
                    </div>
                </div>

                <div class="user-controls">
                    <div class="pd-pill">
                        <div class="pd-live-dot"></div>
                        System Active
                    </div>
                    
                    <button class="btn-icon theme-toggle" id="themeToggle" aria-label="Toggle theme">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    
                    <button class="pd-hbtn" onclick="refreshData()" title="Refresh Data">
                        <i class="fas fa-sync-alt"></i>
                    </button>

                    <a href="{{ url_for('auth.logout') }}" class="btn-signout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- ═══ STATS ═══ -->
        <section class="stats-section">
            <div class="stats-grid">
                <div class="stat-card green fade-up">
                    <div class="stat-icon"><i class="fas fa-heart-pulse"></i></div>
                    <div class="stat-number" id="wellnessScore">0%</div>
                    <div class="stat-label">Dept. Health Index</div>
                </div>
                <div class="stat-card indigo fade-up">
                    <div class="stat-icon"><i class="fas fa-user-graduate"></i></div>
                    <div class="stat-number" id="totalStudents">0</div>
                    <div class="stat-label">Total Students</div>
                </div>
                <div class="stat-card amber fade-up">
                    <div class="stat-icon"><i class="fas fa-bolt"></i></div>
                    <div class="stat-number" id="proctorActions">0</div>
                    <div class="stat-label">Proctor Actions Today</div>
                </div>
                <div class="stat-card red fade-up pulsing" id="criticalCard">
                    <div class="stat-icon"><i class="fas fa-triangle-exclamation"></i></div>
                    <div class="stat-number" id="highRiskCount">0</div>
                    <div class="stat-label">Critical Alerts</div>
                </div>
            </div>
        </section>

        <!-- ═══ MAIN ═══ -->
        <div class="dashboard-layout">
            
            <!-- LEFT COLUMN: RISK MONITOR & TRENDS -->
            <div class="dashboard-left">
                
                <!-- NEW: THE RISK BOX (Risk Oversight) -->
                <section class="card fade-up" id="riskOversightBox">
                    <div class="card-head">
                        <div class="card-title">
                            <span class="card-title-icon icon-red"><i class="fas fa-shield-alt"></i></span>
                            Risk Oversight Monitor
                        </div>
                        <span class="count-pill red" id="riskOversightCount">0</span>
                    </div>
                    <div class="card-body no-pad scrollable">
                        <div class="table-container">
                            <table class="tbl" id="riskOversightTable">
                                <thead>
                                    <tr>
                                        <th>Student</th>
                                        <th>Risk</th>
                                        <th>Source</th>
                                        <th>Status</th>
                                        <th>Time</th>
                                    </tr>
                                </thead>
                                <tbody id="riskOversightBody">
                                    <!-- JS Render -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <section class="card fade-up">
                    <div class="card-head">
                        <div class="card-title">
                            <span class="card-title-icon icon-blue"><i class="fas fa-chart-line"></i></span>
                            Wellness Trajectory (30-Day Trend)
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="trendChart"></div>
                    </div>
                </section>
            </div>

            <!-- RIGHT COLUMN: DISTRIBUTION & PROCTORS -->
            <div class="dashboard-right">
                <section class="card fade-up">
                    <div class="card-head">
                        <div class="card-title">Risk Distribution</div>
                    </div>
                    <div class="card-body">
                        <div id="healthChart"></div>
                        <div id="riskBarsContainer"></div>
                    </div>
                </section>

                <section class="card fade-up">
                    <div class="card-head">
                        <div class="card-title">Top Proctor Activity</div>
                    </div>
                    <div class="card-body no-pad" id="proctorTable">
                        <!-- JS Render -->
                    </div>
                </section>
            </div>

        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='js/hod_dashboard.js') }}"></script>
</body>
</html>
