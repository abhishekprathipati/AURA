{% extends 'base.html' %}

{% block title %}AURA - {{ error_code or 500 }}{% endblock %}

{% block extra_css %}
<style nonce="{{ csp_nonce }}">
    .error-wrap {
        min-height: calc(100vh - 2rem);
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
    }

    .error-card {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: clamp(1.25rem, 2vw + 1rem, 2.25rem);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.12);
        color: #0f172a;
        border: 1px solid rgba(15, 23, 42, 0.08);
    }

    .error-code {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 3vw + 1rem, 3rem);
        line-height: 1;
        font-weight: 800;
        color: #111827;
    }

    .error-message {
        margin: 0 0 0.85rem;
        font-size: 1.05rem;
        line-height: 1.55;
        color: #1f2937;
    }

    .error-hint {
        margin: 0 0 1.4rem;
        color: #475569;
    }

    .error-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1.1rem;
        border-radius: 10px;
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
    }

    .error-home:hover,
    .error-home:focus-visible {
        background: #111827;
    }
</style>
{% endblock %}

{% block content %}
<section class="error-wrap" aria-live="polite">
    <div class="error-card">
        <h1 class="error-code">{{ error_code or 500 }}</h1>
        <p class="error-message">{{ error_msg or 'Something went wrong.' }}</p>
        <p class="error-hint">Try returning to the login page or dashboard.</p>
        <a href="{{ url_for('index') }}" class="error-home">Go to Home</a>
    </div>
</section>
{% endblock %}
