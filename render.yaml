services:
  - type: web
    name: aura-student-wellness
    env: python
    runtime: python-3.11
    
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind=0.0.0.0:$PORT --timeout=120 --access-logfile - app:app
    
    envVars:
      - key: FLASK_ENV
        value: production
      
      - key: DEBUG
        value: "false"
      
      - key: PYTHON_VERSION
        value: "3.11"
      
      # Database & Redis
      - key: MONGODB_URI
        sync: false
      
      - key: REDIS_URL
        sync: false
      
      # Secret key (generate with: python -c "import secrets; print(secrets.token_hex(32))")
      - key: SECRET_KEY
        sync: false
      
      # AI API Keys
      - key: OPENAI_API_KEY
        sync: false
      
      - key: GEMINI_API_KEY
        sync: false
      
      - key: GROQ_API_KEY
        sync: false
      
      - key: DEEPSEEK_API_KEY
        sync: false
    
    # Health check
    healthCheckPath: /
    healthCheckStartupFailureThresholdCount: 5
    
    # Disk (free tier)
    disk:
      name: aura-storage
      sizeGB: 1
    
    # Plan (free tier has limits)
    plan: free
    numInstances: 1
