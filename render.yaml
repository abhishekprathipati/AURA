# render.yaml — Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aura
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: aura_db
      - key: MONGODB_TLS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: PROXY_FIX_ENABLED
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AURA_REQUIRE_AI
        value: "false"
      - key: AURA_STRUCTURED_RESPONSES
        value: "true"
      - key: AURA_DYNAMIC_LENGTH
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: SMS_ENABLED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.6"
