name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      TESTING: "true"
      SECRET_KEY: test-secret-key-ci
      MONGODB_URI: mongodb://localhost:27017/aura_test
      SMS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Lint with ruff
        run: |
          ruff check app.py config.py models routes services utils

      - name: Compile check
        run: |
          python -m compileall app.py config.py models routes services utils
